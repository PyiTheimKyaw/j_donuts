name: j_donuts
description: "J'Donuts customer app: onboarding with fake auth, offline-first catalogue and an animated rewards screen."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cached_network_image: ^4.0.6
  connectivity_plus: ^7.3.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.5.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/seed/
    - assets/images/products/
    - assets/images/banners/
    - assets/images/shops/
    - assets/images/rewards/
    - assets/images/member/
    - assets/remote/v1/

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
